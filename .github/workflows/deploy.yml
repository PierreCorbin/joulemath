name: Deploy to Cloudflare Pages
on:
  push:
    branches: [main]
  # Daily rebuild so build-time live data (ASIC hashprice, power price pages) stays fresh.
  schedule:
    - cron: '0 5 * * *'
  workflow_dispatch:
jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # full history for sitemap lastmod
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node build.mjs
      - uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy dist --project-name=joulemath --branch=main
