# Cloudflare Pages config. KV namespace IDs are not secrets.
# These bindings are the production namespaces (joulemath-subscribers and joulemath-events).
# Preview hosts must not use them. Code sends preview traffic to SUBSCRIBERS_PREVIEW and
# EVENTS_PREVIEW only, and drops it when those bindings are missing.
# Do not point a preview deployment at the ids below.
# .github/workflows/kv-setup.yml binds separate preview namespaces. It does not run on deploy.
name = "joulemath"
pages_build_output_dir = "dist"
compatibility_date = "2026-10-21"

[[kv_namespaces]]
binding = "SUBSCRIBERS"   # joulemath-subscribers
id = "09fb6b918f8b4ea08a5ec401975afb41"

[[kv_namespaces]]
binding = "EVENTS"        # joulemath-events
id = "25910d4d5f5e4dee8dd20e3336a1e227"
